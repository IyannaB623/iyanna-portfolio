<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
    <meta
      name="description"
      content="Iyanna Blackburn is an M.S. Business Analytics student at USC Marshall working across data analysis, development, AI automation, UI/UX, and creative direction."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iyanna Blackburn" />
    <meta property="og:title" content="Iyanna Blackburn | Where Data Meets Creativity" />
    <meta
      property="og:description"
      content="Iyanna Blackburn is an M.S. Business Analytics student at USC Marshall working across data analysis, development, AI automation, UI/UX, and creative direction."
    />
    <meta name="theme-color" content="#e7ecdf" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Iyanna Blackburn | Where Data Meets Creativity</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
